[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twmarket"
version = "0.1.0"
description = "Point-in-time Taiwan market data (monthly revenue, daily prices, trading calendar) for quant research"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Waveorwaves" }]
keywords = ["taiwan", "twse", "mops", "quant", "point-in-time", "market-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "requests>=2.28",
    "pandas>=2.0",
    "pyarrow>=14.0",
]

[project.urls]
Repository = "https://github.com/Waveorwaves/twmarket"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
