[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twmarket"
version = "0.1.1"
description = "Point-in-time Taiwan market data (monthly revenue, daily prices, trading calendar) for quant research"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Waveorwaves" }]
keywords = ["taiwan", "twse", "mops", "quant", "point-in-time", "market-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "requests>=2.28",
    "pandas>=2.0",
    "pyarrow>=14.0",
]

[project.urls]
Repository = "https://github.com/Waveorwaves/twmarket"
Changelog = "https://github.com/Waveorwaves/twmarket/blob/main/CHANGELOG.md"
Issues = "https://github.com/Waveorwaves/twmarket/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

# The source distribution carries the package, its tests and the user-facing docs —
# not planning notes or whatever else happens to sit in the working directory.
[tool.hatch.build.targets.sdist]
# Leading slashes anchor each pattern at the repo root (docs/dev/README.md stays out).
include = ["/src", "/tests", "/docs/sources.md", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
